<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capteur TempHumiX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Capteur IdO TempHumiX</h1>
    <span id="badge" class="badge off">Déconnecté</span>
  </header>

  <nav>
    <button class="onglet actif" data-vue="tableau">Tableau de bord</button>
    <button class="onglet" data-vue="courbes">Courbes</button>
    <button class="onglet" data-vue="base">Base de données</button>
  </nav>

  <main>
    <!-- ============ Tableau de bord ============ -->
    <section id="tableau" class="vue actif">
      <fieldset>
        <legend>Paramètres de communication du broker MQTT</legend>
        <form id="formConnexion" class="grille">
          <label>Adresse IP <input id="ip" required pattern="^(\d{1,3}\.){3}\d{1,3}$"></label>
          <label>Port <input id="port" type="number" min="1" max="65535" required></label>
          <label>Utilisateur <input id="user"></label>
          <label>Mot de passe <input id="password" type="password"></label>
          <label>Id capteur <input id="idCapteur" type="number" required></label>
          <div class="boutons">
            <button type="submit" id="btnConnect">Connecter</button>
            <button type="button" id="btnDisconnect" disabled>Déconnecter</button>
          </div>
        </form>
      </fieldset>

      <fieldset>
        <legend>Affichage des données du capteur</legend>
        <p id="date" class="date">--/--/---- --:--:--</p>
        <div class="mesures">
          <div class="mesure"><span>Température</span><strong id="temperature">--</strong> °C</div>
          <div class="mesure"><span>Humidité</span><strong id="humidite">--</strong> %</div>
          <div class="mesure"><span>Version</span><strong id="version">--</strong></div>
        </div>
      </fieldset>

      <fieldset id="commandes" disabled>
        <legend>Commandes</legend>
        <button class="large" data-cmd="synchro">Synchronisation de la date et heure du capteur (NTP)</button>
        <div class="grille2">
          <button data-cmd="stop">Arrêter les mesures</button>
          <button data-cmd="start">Démarrer les mesures</button>
          <button data-cmd="slowBlink">Clignotement lent</button>
          <button data-cmd="fastBlink">Clignotement rapide</button>
        </div>
        <form id="formBlink" class="ligne">
          <label>Clignotement personnalisé (ms)
            <input id="blink" type="number" min="100" max="10000" step="100" value="500" required>
          </label>
          <button type="submit">Envoyer</button>
        </form>
        <form id="formBargraph" class="ligne">
          <label>Valeur du bargraphe (0 à 1023)
            <input id="bargraph" type="range" min="0" max="1023" value="0">
          </label>
          <output id="bargraphVal">0</output>
          <button type="submit">Envoyer</button>
        </form>
      </fieldset>
    </section>

    <!-- ============ Courbes ============ -->
    <section id="courbes" class="vue">
      <fieldset>
        <legend>Paramètres de l'intervalle temporel</legend>
        <form id="formCourbes" class="ligne">
          <label>Début <input id="debut" type="datetime-local" step="1" required></label>
          <label>Fin <input id="fin" type="datetime-local" step="1" required></label>
          <label>Capteur <select id="capteurCourbe"></select></label>
          <button type="submit">Charger les données</button>
          <button type="button" id="btnEffacer">Effacer les courbes</button>
        </form>
      </fieldset>
      <p id="infoCourbes" class="info"></p>
      <div class="graphe"><canvas id="graphe"></canvas></div>
    </section>

    <!-- ============ Base de données ============ -->
    <section id="base" class="vue">
      <fieldset>
        <legend>Consulter la table IOT_Data</legend>
        <form id="formBase" class="ligne">
          <label>Début <input id="debutBase" type="datetime-local" step="1" required></label>
          <label>Fin <input id="finBase" type="datetime-local" step="1" required></label>
          <label>Capteur <select id="capteurBase"></select></label>
          <button type="submit">Afficher</button>
        </form>
      </fieldset>
      <p id="infoBase" class="info"></p>
      <div class="table">
        <table>
          <thead><tr><th>Id capteur</th><th>Date</th><th>Version</th><th>Température (°C)</th><th>Humidité (%)</th></tr></thead>
          <tbody id="lignes"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="lib/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
